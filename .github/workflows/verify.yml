name: Verify companion

on:
  push:
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight verifier dependencies
        run: python -m pip install -e .
      - name: Verify source hashes, claims, guides and links
        run: python scripts/verify_companion.py
      - name: Verify frozen predictions and constraints
        run: python scripts/reproduce/verify_release.py
      - name: Recompute prospective summary statistics
        run: python scripts/reproduce/recompute_statistics.py --root . --output /tmp/glider-statistics
