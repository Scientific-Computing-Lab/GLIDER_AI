name: Verify scientific release
on: [push, pull_request]
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/reproduce/verify_release.py
      - run: python scripts/reproduce/score_experiment.py --experiment all
      - run: python scripts/reproduce/recompute_statistics.py --output build/statistics
      - run: python scripts/verify_companion.py
